[project]
name = "attestation-platform"
version = "0.0.1"
description = "Continuous insurance-grade control attestation for SMBs (Phase 0 scaffold)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
